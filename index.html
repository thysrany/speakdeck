<title>SpeakDeck 4.1.2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body{background:#0f0f0f;color:#f0ece3}
body.light{background:#f4f4f4;color:#1a1a1a}
:root{
  --gold:#f5c842;--gold2:#c9a130;
  --bg:#0f0f0f;--s:#1a1a1a;--s2:#222;--b:#2a2a2a;
  --t:#f0ece3;--t2:#ccc;--t3:#888;
  --folder-name:#e0dcd3;--topic-name:#ccc;
  --row-hover:#1e1e1e;--row-active:#222;
  --toc-head:#1e1e1e;--card-bg:#1a1a1a;
  --modal-bg:#1c1c1c;--input-bg:#111;
  --handle:#888;--faction-border:#555;--faction-color:#aaa;
  --overlay:rgba(0,0,0,.85);--sb-overlay:rgba(0,0,0,.6);
  --red:#c0392b;--toast-bg:#1e1e1e;--toast-border:#333;--empty-h:#444;
}
body.light{
  --bg:#f4f4f4;--s:#fff;--s2:#f0f0f0;--b:#ddd;
  --t:#1a1a1a;--t2:#333;--t3:#666;
  --folder-name:#1a1a1a;--topic-name:#333;
  --row-hover:#f0f0f0;--row-active:#fff8e1;
  --toc-head:#f5f5f5;--card-bg:#fff;
  --modal-bg:#fff;--input-bg:#f8f8f8;
  --handle:#999;--faction-border:#ccc;--faction-color:#555;
  --overlay:rgba(0,0,0,.5);--sb-overlay:rgba(0,0,0,.3);
  --toast-bg:#fff;--toast-border:#ddd;--empty-h:#999;
}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;background:var(--bg);position:relative}
.topbar{padding:10px 16px;border-bottom:1px solid var(--b);background:var(--s);flex-shrink:0;gap:8px;overflow:hidden;max-height:200px;transition:max-height .25s,padding .25s,opacity .25s,background .3s;opacity:1}
.topbar.hidden{max-height:0;padding-top:0;padding-bottom:0;border-bottom:none;opacity:0}
.topbar-left{display:flex;align-items:flex-start;gap:10px}
.menu-btn{width:36px;height:36px;background:transparent;border:1px solid var(--b);border-radius:7px;color:var(--t3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.topbar h2{font-size:14px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb{font-size:11px;color:var(--t3);margin-bottom:2px}
.breadcrumb span{color:var(--gold)}
.tb-actions-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.topbar-toggle{display:flex;align-items:center;justify-content:center;height:24px;background:var(--s);border-bottom:1px solid var(--b);cursor:pointer;flex-shrink:0}
.topbar-toggle-icon{font-size:16px;color:var(--gold);font-weight:900;line-height:1}
.content{flex:1;padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
/* BUTTONS */
.btn{padding:7px 13px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s;border:none;white-space:nowrap;font-family:inherit}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:active{background:var(--gold2)}
.btn-ghost{background:transparent;color:var(--t3);border:1px solid var(--b)}
.btn-ghost:active{color:var(--t)}
.btn-red{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:5px 10px;font-size:11px}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;gap:10px;color:var(--t3);text-align:center}
.empty .ei{font-size:44px}
.empty h3{font-size:20px;font-weight:900;color:var(--empty-h)}
.empty p{font-size:13px;max-width:260px;line-height:1.6}
/* TOC */
.toc-hdr{margin-bottom:18px}
.toc-hdr h3{font-size:20px;font-weight:900;margin-bottom:4px;color:var(--t)}
.toc-hdr p{font-size:12px;color:var(--t3)}
.toc-table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:10px;overflow:hidden;border:1px solid var(--b)}
.toc-table thead tr{background:var(--toc-head)}
.toc-table th{padding:9px 14px;text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);font-weight:500}
.toc-table tbody tr{border-top:1px solid var(--b);cursor:pointer}
.toc-table tbody tr:active{background:var(--row-hover)}
.toc-table td{padding:12px 14px;font-size:13px;color:var(--t)}
.tc-num{color:var(--t3);font-size:11px;width:32px}
.tc-title{font-weight:700}
.tc-acts{display:flex;gap:5px;justify-content:flex-end}
.tc-btn{background:transparent;border:1px solid var(--b);border-radius:5px;padding:4px 8px;font-size:10px;cursor:pointer;color:var(--t3);font-family:inherit}
.tc-btn.prs{color:var(--gold);border-color:var(--gold)}
.tc-btn.del:active{color:var(--red);border-color:var(--red)}
.dhandle{color:var(--handle);cursor:grab;font-size:14px;padding:0 4px;user-select:none}
tr.drag-over{border-top:2px solid var(--gold)!important}
tr.dragging{opacity:.35}
@media(max-width:640px){.tc-btn.prs,.tc-btn.del{display:none}}
/* SLIDE */
.slide-view{display:flex;flex-direction:column;height:100%;gap:8px;user-select:none}
.slide-stage{flex:1;position:relative;overflow:hidden;min-height:0;border-radius:14px;touch-action:pan-y}
.slide-card{position:absolute;inset:0;background:var(--card-bg);border:1px solid var(--b);border-radius:14px;padding:28px 32px;display:flex;flex-direction:column;gap:22px;overflow:hidden;transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s;will-change:transform,opacity}
.slide-card.swipe-left{transform:translateX(-100%);opacity:0}
.slide-card.swipe-right{transform:translateX(100%);opacity:0}
.slide-card.incoming-right{transform:translateX(100%);opacity:0;transition:none}
.slide-card.incoming-left{transform:translateX(-100%);opacity:0;transition:none}
.slide-card.center{transform:translateX(0);opacity:1}
.slide-card.dragging-card{transition:none}
.slide-pg-num{display:inline-block;font-size:13px;font-weight:700;color:var(--gold);background:#f5c84218;border:1px solid #f5c84244;border-radius:6px;padding:3px 10px;margin-bottom:8px}
.slide-stitle{font-size:30px;font-weight:900;line-height:1.15;border-bottom:1px solid var(--b);padding-bottom:18px;flex-shrink:0;color:var(--t);cursor:pointer;border-radius:8px;transition:background .15s}
.slide-stitle:hover{background:#f5c84214}
.slide-stitle.copied{background:#f5c84233}
.slide-stitle-text{user-select:text;-webkit-user-select:text}
.slide-bullets{display:flex;flex-direction:column;gap:14px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sbullet{display:flex;align-items:flex-start;gap:12px;font-size:20px;font-weight:500;line-height:1.4;color:var(--t);cursor:pointer;border-radius:8px;padding:4px 6px;margin:-4px -6px;transition:background .15s}
.sbullet:hover{background:#f5c84214}
.sbullet.copied{background:#f5c84233}
.sbullet-text{user-select:text;-webkit-user-select:text}
.sbullet-dot{width:8px;height:8px;min-width:8px;background:var(--gold);border-radius:50%;margin-top:9px;flex-shrink:0}
.sbullet-num{width:22px;height:22px;min-width:22px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#000;margin-top:2px;flex-shrink:0}
@media(max-width:640px){.sbullet-text{user-select:none;-webkit-user-select:none}.slide-stitle-text{user-select:none;-webkit-user-select:none}}
/* QUOTE */
.slide-quote-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0;display:flex;align-items:flex-start}
.slide-quote{position:relative;padding:22px 26px;border-left:4px solid var(--gold);background:#f5c84210;border-radius:0 12px 12px 0;width:100%}
.slide-quote-mark{font-size:64px;line-height:1;color:var(--gold);font-family:Georgia,serif;position:absolute;top:-8px;left:10px;opacity:.5}
.slide-quote-text{font-size:22px;font-weight:600;font-style:italic;line-height:1.55;color:var(--t);padding-left:28px}
.slide-quote-author{margin-top:14px;font-size:15px;font-weight:700;color:var(--gold);padding-left:28px}
/* SLIDE ADD BTN */
.slide-add-btn{width:32px;height:32px;border-radius:50%;background:var(--gold);border:none;color:#000;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px}
/* BIG NAV */
.big-nav{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:2px 0}
.big-nav-btn{flex:0 0 56px;height:46px;border-radius:10px;background:var(--gold);border:none;color:#000;font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.big-nav-btn:active{background:var(--gold2)}
.big-nav-btn[disabled]{opacity:.25;cursor:default}
.page-counter{flex:1;text-align:center;font-size:18px;font-weight:700;color:var(--gold)}
/* TOAST */
.autosave-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--toast-bg);border:1px solid var(--toast-border);border-radius:20px;padding:6px 16px;font-size:11px;color:var(--t3);z-index:999;pointer-events:none;opacity:0;transition:opacity .3s}
.autosave-toast.show{opacity:1}
/* MODAL */
.moverlay{position:fixed;inset:0;background:var(--overlay);z-index:600;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.moverlay{align-items:center}}
.modal{background:var(--modal-bg);border:1px solid var(--b);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:600px){.modal{border-radius:14px}}
.modal-handle{width:40px;height:4px;background:var(--b);border-radius:2px;margin:0 auto 20px}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--t)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:10px;color:var(--t3);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
.fg input,.fg select{width:100%;background:var(--input-bg);border:1px solid var(--b);border-radius:8px;padding:11px 13px;color:var(--t);font-size:15px;font-family:inherit;outline:none;min-height:44px;-webkit-appearance:none}
.fg input:focus,.fg select:focus{border-color:var(--gold)}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;gap:6px;align-items:flex-start}
.brow textarea{flex:1;background:var(--input-bg);border:1px solid var(--b);border-radius:8px;padding:11px 13px;color:var(--t);font-size:15px;font-family:inherit;outline:none;min-height:44px;resize:none;overflow:hidden;line-height:1.5}
.brow textarea:focus{border-color:var(--gold)}
.bnewline,.bdel{background:transparent;border:1px solid var(--b);border-radius:7px;color:var(--t3);width:44px;height:44px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-align:center;line-height:1.2;font-family:inherit}
.bdel:active{border-color:var(--red);color:var(--red)}
.bnewline:active{border-color:var(--gold);color:var(--gold)}
.badd{background:transparent;border:1px dashed var(--b);border-radius:7px;color:var(--t3);padding:10px 14px;cursor:pointer;font-size:13px;font-family:inherit;margin-top:6px;width:100%;text-align:left;min-height:44px}
.badd:active{border-color:var(--gold);color:var(--gold)}
.macts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--b);flex-wrap:wrap}
.list-type-toggle{display:flex;gap:6px;margin-bottom:12px}
.ltt-btn{flex:1;padding:8px;border-radius:7px;border:1px solid var(--b);background:transparent;color:var(--t3);font-size:11px;font-family:inherit;cursor:pointer}
.ltt-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.confirm-box{background:var(--modal-bg);border:1px solid var(--b);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:560px}
@media(min-width:600px){.confirm-box{border-radius:14px}}
.confirm-box h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--t)}
.confirm-box p{font-size:13px;color:var(--t3);margin-bottom:20px;line-height:1.6}
/* SIGN-IN SCREEN */
.signin-screen{position:fixed;inset:0;background:#0f0f0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:24px;padding:40px}
body.light .signin-screen{background:#f4f4f4}
.signin-logo{font-size:52px;font-weight:900;color:var(--gold)}
.signin-tagline{font-size:15px;color:var(--t3);text-align:center;line-height:1.6;max-width:280px}
.signin-google-btn{display:flex;align-items:center;gap:10px;padding:14px 28px;background:var(--gold);color:#000;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.signin-google-btn:active{background:var(--gold2)}
.signin-note{font-size:12px;color:var(--t3);text-align:center;max-width:260px;line-height:1.5}
.app{height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column}
/* HEADER */
.hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px;border-bottom:1px solid var(--b);background:var(--s);flex-shrink:0;overflow:hidden;max-height:140px;transition:max-height .25s,min-height .25s,padding .25s,opacity .25s}
.hdr.hidden{max-height:0;min-height:0;padding-top:0;padding-bottom:0;border-bottom:none;opacity:0}
.hdr-back{width:42px;height:42px;border:none;background:transparent;color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border-radius:10px;padding:0}
.hdr-back:active{background:var(--row-hover)}
.hdr-titles{flex:1;min-width:0}
.hdr-sub{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.hdr-title{font-size:18px;font-weight:800;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-home .hdr-title{font-size:23px;font-weight:900;color:var(--gold);padding-left:6px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;background:transparent;border:1px solid var(--faction-border);color:var(--t2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.icon-btn:active{background:var(--row-hover)}
.avatar-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--faction-border);background:var(--s2);color:var(--gold);font-weight:800;overflow:hidden;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:inherit}
.avatar-btn img{width:40px;height:40px;display:block}
/* LISTS */
.list-wrap{max-width:720px;margin:0 auto;padding-bottom:96px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--b);border-radius:12px;padding:0 8px 0 12px;min-height:48px;margin-bottom:16px}
.search-box:focus-within{border-color:var(--gold)}
.search-box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--t);font-size:16px;font-family:inherit;min-height:46px;-webkit-appearance:none}
.search-clear{width:30px;height:30px;border-radius:50%;border:none;background:var(--s2);color:var(--t3);font-size:18px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.section-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);margin:0 4px 8px}
.rows{background:var(--card-bg);border:1px solid var(--b);border-radius:12px;overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;min-height:60px;border-top:1px solid var(--b);cursor:pointer}
.row:first-child{border-top:none}
.row:active{background:var(--row-hover)}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--folder-name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-text .row-name{flex:none}
.row-sub{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-count{font-size:13px;color:var(--t3);font-weight:700;min-width:22px;text-align:right;flex-shrink:0}
.row-act{width:40px;height:40px;border:none;background:transparent;color:var(--t3);font-size:18px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;padding:0}
.row-act:active{background:var(--s2);color:var(--t)}
.no-results{text-align:center;color:var(--t3);padding:40px 0;font-size:14px}
/* FAB */
.fab{position:absolute;right:20px;bottom:24px;width:60px;height:60px;border-radius:50%;background:var(--gold);color:#000;border:none;font-size:32px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:0;font-family:inherit}
.fab:active{background:var(--gold2)}
/* SHEET */
.sheet-title{font-size:13px;color:var(--t3);text-align:center;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-item{display:block;width:100%;padding:16px 6px;font-size:16px;font-weight:600;background:transparent;border:none;border-top:1px solid var(--b);color:var(--t);text-align:left;cursor:pointer;font-family:inherit}
.sheet-item:active{background:var(--row-hover)}
.sheet-item.danger{color:var(--red)}
.sheet-item.cancel{text-align:center;color:var(--t3)}
.acct-info{text-align:center;margin-bottom:14px}
.acct-info img{width:56px;height:56px;border-radius:50%;margin-bottom:8px}
.acct-name{font-size:16px;font-weight:700;color:var(--t)}
.acct-email{font-size:13px;color:var(--t3);margin-top:2px}
@media(max-width:640px){.slide-stitle{font-size:24px}.sbullet{font-size:18px}.slide-card{padding:20px 18px}}
/* TAG CHIPS */
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:-4px 0 14px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 15px;border-radius:18px;border:1px solid var(--b);background:var(--card-bg);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#000}
.tag-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--input-bg);border:1px solid var(--b);border-radius:8px;padding:7px 9px;min-height:46px;cursor:text}
.tag-box:focus-within{border-color:var(--gold)}
.tag-pill{display:inline-flex;align-items:center;gap:4px;background:#f5c84222;border:1px solid #f5c84266;color:var(--t);border-radius:14px;padding:4px 4px 4px 11px;font-size:13px;font-weight:600}
.tag-pill button{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--t3);font-size:15px;cursor:pointer;padding:0;line-height:1}
.fg .tag-box input{flex:1;min-width:110px;width:auto;border:none;background:transparent;padding:4px 2px;min-height:30px}
.tag-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-opt{padding:7px 12px;border-radius:14px;border:1px solid var(--b);background:transparent;color:var(--t2);font-size:13px;cursor:pointer;font-family:inherit}
.tag-opt.tag-new{border-style:dashed;color:var(--gold);border-color:var(--gold)}
/* HIDE SCROLLBARS (scrolling still works) */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</head>

function loadData(){
  try{
    var r=localStorage.getItem(SAVE_KEY);
    if(r){
      var d=JSON.parse(r);
      var merged=Object.assign({},DEFAULT,d);
      // Sanitize all pages — ensure every page has required fields
      if(merged.folders){
        merged.folders.forEach(function(f){
          if(!f.topics) f.topics=[];
          f.topics.forEach(function(t){
            if(!t.pages) t.pages=[];
            t.pages=t.pages.filter(function(p){return p&&p.title;}).map(function(p){
              return {
                title:p.title||'Untitled',
                listType:p.listType||'bullet',
                bullets:Array.isArray(p.bullets)?p.bullets:[],
                quoteText:p.quoteText||'',
                quoteAuthor:p.quoteAuthor||''
              };
            });
            t.tags=Array.isArray(t.tags)?t.tags.filter(function(g){return typeof g==='string'&&g;}):[];
          });
        });
      }
      return merged;
    }
  }catch(e){}
  return Object.assign({},DEFAULT);
}
function saveData(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({folders:S.folders,selectedTopicId:S.selectedTopicId,folderId:S.folderId,view:S.view,page:S.page}));}catch(e){}
  if(window._fb&&window._fbUser&&window._fbUser.uid){

    var foldersForCloud=S.folders.map(function(f){
      var fc=Object.assign({},f);

    });
    window._fb.save(window._fbUser.uid,{folders:foldersForCloud,selectedTopicId:S.selectedTopicId,updatedAt:Date.now()});
  }
}

function copyText(text,ok,fail){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(function(){fb();});
  }else{fb();}
  function fb(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
      document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,99999);
      var res=document.execCommand('copy');document.body.removeChild(ta);
      if(res)ok();else fail();
    }catch(e){fail();}
  }
}

var _navDepth=0,_ignorePop=false;
function viewDepth(v){return v==='home'?0:v==='folder'?1:v==='toc'?2:3;}
function navTo(v){
  var nd=viewDepth(v);
  if(nd>_navDepth){
    while(_navDepth<nd){try{history.pushState({sd:_navDepth+1},'');}catch(e){}_navDepth++;}
  } else if(nd<_navDepth){
    var diff=_navDepth-nd;_navDepth=nd;_ignorePop=true;
    try{history.go(-diff);}catch(e){_ignorePop=false;}
  }
  S.view=v;saveNav();render();
  var c=document.querySelector('.content');if(c)c.scrollTop=0;
}
function goUp(){
  if(S.view==='slide')S.view='toc';
  else if(S.view==='toc')S.view='folder';
  else if(S.view==='folder')S.view='home';
  saveNav();render();
}
function navBack(){
  if(_navDepth>0){try{history.back();return;}catch(e){}}
  goUp();
}
window.addEventListener('popstate',function(){
  if(_ignorePop){_ignorePop=false;return;}
  if(S.modal){
    // Keep the screen; close simple sheets, but never close the page editor without Cancel
    try{history.pushState({sd:_navDepth},'');}catch(e){}
    if(S.modal!=='page'){S.modal=null;S.confirm=null;render();}
    return;
  }
  _navDepth=Math.max(0,_navDepth-1);

});

// ── SWIPE ──
function addSwipe(stage,getCard,onNext,onPrev){
  var startX=0,startY=0,dx=0,dragging=false,lockAxis=null,threshold=55;
  function onStart(x,y){startX=x;startY=y;dx=0;dragging=true;lockAxis=null;var c=getCard();if(c)c.classList.add('dragging-card');}
  function onMove(x,y){
    if(!dragging)return;
    var dX=x-startX,dY=y-startY;
    if(!lockAxis)lockAxis=Math.abs(dX)>Math.abs(dY)?'x':'y';
    if(lockAxis==='y')return;
    dx=dX;var c=getCard();
    if(c){c.style.transform='translateX('+dx+'px)';c.style.opacity=String(1-Math.min(Math.abs(dx)/280,.45));}
  }
  function onEnd(){
    if(!dragging)return;dragging=false;var c=getCard();
    if(c){c.classList.remove('dragging-card');c.style.transform='';c.style.opacity='';}
    if(lockAxis==='y'||!lockAxis)return;
    if(dx<-threshold)onNext();else if(dx>threshold)onPrev();
  }
  stage.addEventListener('touchstart',function(e){var t=e.touches[0];onStart(t.clientX,t.clientY);},{passive:true});
  stage.addEventListener('touchmove',function(e){if(lockAxis==='x')e.preventDefault();var t=e.touches[0];onMove(t.clientX,t.clientY);},{passive:false});
  stage.addEventListener('touchend',onEnd,{passive:true});
  stage.addEventListener('mousedown',function(e){onStart(e.clientX,e.clientY);});
  stage.addEventListener('mousemove',function(e){if(dragging)onMove(e.clientX,e.clientY);});
  stage.addEventListener('mouseup',onEnd);
  stage.addEventListener('mouseleave',onEnd);
}

function animateSlide(stage,oldCard,dir,buildNew){
  var outClass=dir==='next'?'swipe-left':'swipe-right';
  var inClass=dir==='next'?'incoming-right':'incoming-left';
  oldCard.classList.add(outClass);
  var newCard=buildNew();newCard.classList.add(inClass);
  stage.appendChild(newCard);
  requestAnimationFrame(function(){requestAnimationFrame(function(){newCard.classList.remove(inClass);newCard.classList.add('center');});});
  oldCard.addEventListener('transitionend',function(){oldCard.remove();},{once:true});
  return newCard;
}

// ── SEARCH + TAGS ──
function topicTags(t){return Array.isArray(t.tags)?t.tags:[];}
function tagSort(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});}
function tagsIn(topics){
  var seen={},out=[];
  topics.forEach(function(t){topicTags(t).forEach(function(g){var k=g.toLowerCase();if(!seen[k]){seen[k]=1;out.push(g);}});});
  return out.sort(tagSort);
}
function allTagList(){return tagsIn(allTopics());}
function hasTag(t,tag){var k=tag.toLowerCase();return topicTags(t).some(function(g){return g.toLowerCase()===k;});}
function topicMatches(t,q){
  if(!q)return true;
  function has(s){return String(s||'').toLowerCase().indexOf(q)>=0;}
  if(has(t.name))return true;
  return t.pages.some(function(p){
    if(has(p.title)||has(p.quoteText)||has(p.quoteAuthor))return true;
    return (p.bullets||[]).some(has);
  });
}
function chipsHTML(tags,active){
  if(!tags.length)return '';
  return '<div class="chips">'+tags.map(function(g){
    var on=active&&g.toLowerCase()===active.toLowerCase();
    return '<button class="chip'+(on?' on':'')+'" data-tag="'+esc(g)+'">'+esc(g)+'</button>';
  }).join('')+'</div>';
}
function searchBoxHTML(id,val,ph){
  return '<div class="search-box">'+searchSVG()+'<input id="'+id+'" type="text" placeholder="'+ph+'" value="'+esc(val||'')+'" autocomplete="off" autocorrect="off" spellcheck="false"><button class="search-clear" id="'+id+'-clear" style="display:'+(val?'flex':'none')+'" aria-label="Clear">×</button></div>';
}
// Wires a search box + chip row; key = state field for text, tagKey = state field for tag
function wireFilters(wrap,inputId,key,tagKey,refill){
  var inp=wrap.querySelector('#'+inputId);
  var clr=wrap.querySelector('#'+inputId+'-clear');
  inp.addEventListener('input',function(){S[key]=inp.value;clr.style.display=S[key]?'flex':'none';refill();});
  clr.addEventListener('click',function(){S[key]='';inp.value='';clr.style.display='none';refill();inp.focus();});
  wrap.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click',function(){
      var g=c.dataset.tag;
      S[tagKey]=(S[tagKey]&&S[tagKey].toLowerCase()===g.toLowerCase())?'':g;
      wrap.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',!!S[tagKey]&&x.dataset.tag.toLowerCase()===S[tagKey].toLowerCase());});
      refill();
    });
  });
}
function topicRowHTML(t,sub,withMenu){
  return '<div class="row" data-tid="'+t.id+'">'+fileSVG(20)+(sub?'<div class="row-text"><span class="row-name">'+esc(t.name)+'</span><span class="row-sub">'+esc(sub)+'</span></div>':'<span class="row-name">'+esc(t.name)+'</span>')+'<span class="row-count">'+t.pages.length+'</span>'+(withMenu?'<button class="row-act tmenu" data-tid="'+t.id+'" aria-label="Topic options">⋮</button>':'')+'</div>';
}
function wireRows(list){
  list.querySelectorAll('.row[data-fid]').forEach(function(r){
    r.addEventListener('click',function(e){if(e.target.closest('.row-act'))return;openFolder(+r.dataset.fid);});

function fillHomeList(list){
  var q=(S.search||'').trim().toLowerCase();
  var tag=S.homeTag||'';
  var html='';
  if(!q&&!tag){
    if(!S.folders.length){
      list.innerHTML='<div class="empty" id="empty-add" style="cursor:pointer">'+folderSVG(44)+'<h3>No folders yet</h3><p style="color:var(--gold);font-weight:700;font-size:15px">Tap to create your first folder</p></div>';
      list.querySelector('#empty-add').addEventListener('click',function(){S.modal='new-folder';render();});
      return;
    }
    html='<div class="rows">';
    sortedFolders().forEach(function(f){
      html+='<div class="row" data-fid="'+f.id+'">'+folderSVG(22)+'<span class="row-name">'+esc(f.name)+'</span><span class="row-count">'+f.topics.length+'</span><button class="row-act edit-f" data-fid="'+f.id+'" aria-label="Edit folder">✎</button></div>';
    });
    html+='</div>';
  } else {
    var fMatches=(q&&!tag)?sortedFolders().filter(function(f){return f.name.toLowerCase().indexOf(q)>=0;}):[];
    var tMatches=[];
    sortedFolders().forEach(function(f){
      sortedTopics(f).forEach(function(t){
        if((!tag||hasTag(t,tag))&&topicMatches(t,q))tMatches.push({t:t,f:f});
      });
    });
    if(!fMatches.length&&!tMatches.length){
      list.innerHTML='<div class="no-results">No matches</div>';
      return;
    }
    if(fMatches.length){
      html+='<div class="section-label">Folders</div><div class="rows">';
      fMatches.forEach(function(f){
        html+='<div class="row" data-fid="'+f.id+'">'+folderSVG(22)+'<span class="row-name">'+esc(f.name)+'</span><span class="row-count">'+f.topics.length+'</span></div>';
      });
      html+='</div>';
    }
    if(tMatches.length){
      html+='<div class="section-label">Topics</div><div class="rows">';
      tMatches.forEach(function(m){html+=topicRowHTML(m.t,m.f.name,false);});
      html+='</div>';
    }
  }
  list.innerHTML=html;
  wireRows(list);
}

    wrap.querySelector('#empty-add').addEventListener('click',function(){S.modal='new-topic';S.editFolderTarget=folder.id;render();});
  } else {
    var tags=tagsIn(folder.topics);
    if(S.folderTag&&!tags.some(function(g){return g.toLowerCase()===S.folderTag.toLowerCase();}))S.folderTag='';
    wrap.innerHTML=searchBoxHTML('fsearch',S.folderSearch,'Search in '+esc(folder.name))+chipsHTML(tags,S.folderTag)+'<div id="folder-list"></div>';
    var list=wrap.querySelector('#folder-list');
    var refill=function(){
      var q=(S.folderSearch||'').trim().toLowerCase();
      var tag=S.folderTag||'';
      var ts=sortedTopics(folder).filter(function(t){return (!tag||hasTag(t,tag))&&topicMatches(t,q);});
      if(!ts.length){list.innerHTML='<div class="no-results">No matches</div>';return;}
      list.innerHTML='<div class="rows">'+ts.map(function(t){return topicRowHTML(t,'',true);}).join('')+'</div>';
      wireRows(list);
    };
    refill();
    wireFilters(wrap,'fsearch','folderSearch','folderTag',refill);
  }
  content.appendChild(wrap);

  main.appendChild(buildFab(function(){S.modal='new-topic';S.editFolderTarget=folder.id;render();}));
}

// Tag editor inside the topic sheet. Returns a function that gives the final tag list.
function wireTagEditor(m,startTags){
  var tags=startTags.slice();
  var box=m.querySelector('#tag-box'),inp=m.querySelector('#tag-input'),sug=m.querySelector('#tag-sug');
  var pool=allTagList();
  function canon(s){
    s=s.replace(/\s+/g,' ').trim();if(!s)return '';
    var ex=pool.filter(function(g){return g.toLowerCase()===s.toLowerCase();})[0];
    return ex||s;
  }
  function add(raw){
    var g=canon(raw);
    if(g&&!tags.some(function(x){return x.toLowerCase()===g.toLowerCase();}))tags.push(g);
    inp.value='';drawPills();drawSug();
  }
  function drawPills(){
    box.querySelectorAll('.tag-pill').forEach(function(p){p.remove();});
    tags.forEach(function(g,i){
      var p=el('span','tag-pill');
      p.innerHTML=esc(g)+'<button type="button" data-ti="'+i+'" aria-label="Remove">×</button>';
      p.querySelector('button').addEventListener('click',function(){tags.splice(i,1);drawPills();drawSug();});
      box.insertBefore(p,inp);
    });
  }
  function drawSug(){
    var q=inp.value.trim().toLowerCase();
    if(!q){sug.innerHTML='';return;}
    var opts=pool.filter(function(g){return g.toLowerCase().indexOf(q)>=0&&!tags.some(function(x){return x.toLowerCase()===g.toLowerCase();});});
    var exact=pool.some(function(g){return g.toLowerCase()===q;})||tags.some(function(x){return x.toLowerCase()===q;});
    var html=opts.slice(0,6).map(function(g){return '<button type="button" class="tag-opt" data-g="'+esc(g)+'">'+esc(g)+'</button>';}).join('');
    if(!exact)html+='<button type="button" class="tag-opt tag-new" data-g="'+esc(inp.value.trim())+'">+ Add "'+esc(inp.value.trim())+'"</button>';
    sug.innerHTML=html;
    sug.querySelectorAll('.tag-opt').forEach(function(b){
      b.addEventListener('mousedown',function(e){e.preventDefault();});
      b.addEventListener('click',function(){add(b.dataset.g);inp.focus();});
    });
  }
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();if(inp.value.trim())add(inp.value);}
    else if(e.key==='Backspace'&&!inp.value&&tags.length){tags.pop();drawPills();}
  });
  inp.addEventListener('input',function(){
    if(inp.value.indexOf(',')>=0){inp.value.split(',').forEach(function(p){if(p.trim())add(p);});return;}
    drawSug();
  });
  box.addEventListener('click',function(e){if(e.target===box)inp.focus();});
  drawPills();
  return function(){if(inp.value.trim())add(inp.value);return tags.slice();};
}

function buildSlideCard(topic,idx){
  var page=topic.pages[idx];
  if(!page) page={title:'',listType:'bullet',bullets:[]};
  var listType=page.listType||'bullet';
  var card=el('div','slide-card center');
  var body='';
  if(listType==='quote'){
    var qText=page.quoteText||'';
    var qFull=qText+(page.quoteAuthor?'\n— '+page.quoteAuthor:'');
    body='<div class="slide-quote-wrap"><div class="slide-quote" data-qtext="'+esc(qFull)+'"><div class="slide-quote-mark">"</div><div class="slide-quote-text sbullet-text">'+esc(qText)+'</div>'+(page.quoteAuthor?'<div class="slide-quote-author">— '+esc(page.quoteAuthor)+'</div>':'')+'</div></div>';
  } else {
    var isNum=listType==='number';
    body='<div class="slide-bullets">'+(page.bullets||[]).map(function(b,i){
      return '<div class="sbullet" data-btext="'+esc(b)+'">'+(isNum?'<div class="sbullet-num">'+(i+1)+'</div>':'<div class="sbullet-dot"></div>')+'<div class="sbullet-text">'+esc(b).replace(/\n/g,'<br>')+'</div></div>';
    }).join('')+'</div>';
  }
  card.innerHTML='<div><div class="slide-pg-num">Page '+(idx+1)+' of '+topic.pages.length+'</div><div class="slide-stitle" data-titletext="'+esc(page.title)+'"><span class="slide-stitle-text">'+esc(page.title)+'</span></div></div>'+body;

  // Long-press copy title
  var titleEl=card.querySelector('.slide-stitle');
  if(titleEl){
    var pt=null;
    titleEl.addEventListener('touchstart',function(){pt=setTimeout(function(){copyText(titleEl.dataset.titletext,function(){titleEl.classList.add('copied');showToast('Copied!');setTimeout(function(){titleEl.classList.remove('copied');},600);},function(){showToast('Copy failed');});},500);},{passive:true});
    titleEl.addEventListener('touchend',function(){clearTimeout(pt);},{passive:true});
    titleEl.addEventListener('touchmove',function(){clearTimeout(pt);},{passive:true});
  }
  // Long-press copy bullets
  card.querySelectorAll('.sbullet[data-btext]').forEach(function(row){
    var pt2=null;
    row.addEventListener('touchstart',function(){pt2=setTimeout(function(){copyText(row.dataset.btext,function(){row.classList.add('copied');showToast('Copied!');setTimeout(function(){row.classList.remove('copied');},600);},function(){showToast('Copy failed');});},500);},{passive:true});
    row.addEventListener('touchend',function(){clearTimeout(pt2);},{passive:true});
    row.addEventListener('touchmove',function(){clearTimeout(pt2);},{passive:true});
  });
  // Long-press copy quote
  var qEl=card.querySelector('.slide-quote[data-qtext]');
  if(qEl){
    var pt3=null;
    qEl.addEventListener('touchstart',function(){pt3=setTimeout(function(){copyText(qEl.dataset.qtext,function(){qEl.style.background='#f5c84233';showToast('Copied!');setTimeout(function(){qEl.style.background='';},600);},function(){showToast('Copy failed');});},500);},{passive:true});
    qEl.addEventListener('touchend',function(){clearTimeout(pt3);},{passive:true});
    qEl.addEventListener('touchmove',function(){clearTimeout(pt3);},{passive:true});
  }
  return card;
}

function renderSlideView(content,topic){
  var pages=topic.pages,idx=S.page;
  var d=el('div','slide-view');
  var dotsHTML='<span class="page-counter" id="page-ctr">'+(idx+1)+'/'+pages.length+'</span>';
  d.innerHTML='<div class="slide-stage" id="slide-stage"></div><div class="big-nav"><button class="big-nav-btn" id="sprev"'+(idx===0?' disabled':'')+'>←</button>'+dotsHTML+'<button class="big-nav-btn" id="snext"'+(idx===pages.length-1?' disabled':'')+'>→</button></div>';
  var stage=d.querySelector('#slide-stage');
  stage.appendChild(buildSlideCard(topic,idx));
  function goTo(ni,dir){
    if(ni<0||ni>=pages.length)return;
    S.page=ni;saveNav();
    var old=stage.querySelector('.slide-card');
    animateSlide(stage,old,dir,function(){return buildSlideCard(topic,ni);});
    var ctr=d.querySelector('#page-ctr');
    if(ctr)ctr.textContent=(ni+1)+'/'+pages.length;
    d.querySelector('#sprev').disabled=ni===0;
    d.querySelector('#snext').disabled=ni===pages.length-1;
  }
  d.querySelector('#sprev').addEventListener('click',function(){goTo(S.page-1,'prev');});
  d.querySelector('#snext').addEventListener('click',function(){goTo(S.page+1,'next');});
  d.querySelectorAll('.sdot').forEach(function(dot){dot.addEventListener('click',function(){var i=+dot.dataset.di;goTo(i,i>S.page?'next':'prev');});});
  addSwipe(stage,function(){return stage.querySelector('.slide-card');},function(){goTo(S.page+1,'next');},function(){goTo(S.page-1,'prev');});
  content.appendChild(d);
}

function renderModal(app){
  var ov=el('div','moverlay');
  ov.addEventListener('click',function(e){
    if(e.target===ov){
      // Don't close the page modal by clicking outside — must use Cancel
      if(S.modal==='page') return;
      S.modal=null;S.insertAfter=null;render();
    }
  });

  if(S.modal==='page'){
    var topic=getTopic(),editing=S.editPageIdx!==null,ex=editing?topic.pages[S.editPageIdx]:null;
    var bullets=ex?(ex.bullets||[]).slice():['',''];
    var listType=(ex&&ex.listType)||'bullet';
    var m=el('div','modal');
    m.innerHTML='<div class="modal-handle"></div><h3>'+(editing?'Edit Page':'Add New Page')+'</h3><div class="fg"><label>Page Title</label><input id="ptitle" value="'+(ex?esc(ex.title):'')+'" placeholder="e.g. The Key Insight" autocomplete="off"></div><div class="fg"><label>Page Style</label><div class="list-type-toggle"><button class="ltt-btn'+(listType==='bullet'?' active':'')+'" data-lt="bullet">● Bullets</button><button class="ltt-btn'+(listType==='number'?' active':'')+'" data-lt="number">1. Numbers</button><button class="ltt-btn'+(listType==='quote'?' active':'')+'" data-lt="quote">" Quote</button></div></div><div id="bullets-section" style="display:'+(listType==='quote'?'none':'block')+'"><div class="fg"><label>Points (max 7)</label><div style="font-size:10px;color:var(--t3);margin-bottom:8px">Enter = new point · ↵ line button = new line · Paste splits lines</div><div class="blist" id="blist"></div><button class="badd" id="badd">+ Add Point</button></div></div><div id="quote-section" style="display:'+(listType==='quote'?'block':'none')+'"><div class="fg"><label>Quote Text</label><input id="quote-text" value="'+(ex&&ex.quoteText?esc(ex.quoteText):'')+'" placeholder="Enter the quote here..." autocomplete="off"></div><div class="fg"><label>Author (optional)</label><input id="quote-author" value="'+(ex&&ex.quoteAuthor?esc(ex.quoteAuthor):'')+'" placeholder="— Author name" autocomplete="off"></div></div><div class="macts">'+(editing?'<button class="btn btn-red" id="del-pg-btn">Delete</button>':'')+'<button class="btn btn-ghost" id="mcancel">Cancel</button><button class="btn btn-gold" id="msave">'+(editing?'Save':'Add Page')+'</button></div>';

    var undoStack = [JSON.stringify(bullets)];
    var undoIdx = 0;

    function pushUndo(){
      var snap = JSON.stringify(bullets);
      if(snap === undoStack[undoIdx]) return; // no change
      undoStack = undoStack.slice(0, undoIdx+1);
      undoStack.push(snap);
      undoIdx = undoStack.length-1;
    }

    function upd(fi){
      var bl=m.querySelector('#blist');
      bl.innerHTML=bullets.map(function(_,i){return '<div class="brow"><textarea class="bi" data-i="'+i+'" rows="1" placeholder="Point '+(i+1)+'...">'+esc(bullets[i]||'')+'</textarea><button class="bnewline" data-nl="'+i+'">↵<br>line</button><button class="bdel" data-d="'+i+'">×</button></div>';}).join('');
      bl.querySelectorAll('.bi').forEach(function(ta){
        ta.addEventListener('keydown',function(e){
          // Ctrl+Z — undo bullet changes
          if((e.ctrlKey||e.metaKey)&&e.key==='z'){
            e.preventDefault();
            if(undoIdx>0){
              undoIdx--;
              bullets=JSON.parse(undoStack[undoIdx]);
              upd();
            }
            return;
          }
          // Ctrl+Shift+Z / Ctrl+Y — redo
          if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){
            e.preventDefault();
            if(undoIdx<undoStack.length-1){
              undoIdx++;
              bullets=JSON.parse(undoStack[undoIdx]);
              upd();
            }
            return;
          }
          if(e.key==='Enter'){
            e.preventDefault();
            pushUndo();
            var i=+ta.dataset.i;
            if(bullets.length<7){
              var pos=ta.selectionStart;
              var before=ta.value.slice(0,pos),after=ta.value.slice(pos);
              bullets[i]=before;bullets.splice(i+1,0,after);upd(i+1);
            }
          }
        });
        ta.addEventListener('input',function(){
          bullets[+ta.dataset.i]=ta.value;
          // Push undo after short pause (debounced)
          clearTimeout(ta._undoTimer);
          ta._undoTimer=setTimeout(pushUndo, 500);
          var resize=function(){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';};
          resize();
        });
        ta.addEventListener('paste',function(e){
          e.preventDefault();
          pushUndo();
          var text=(e.clipboardData||window.clipboardData).getData('text');
          var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l;});
          if(!lines.length) return;
          var i=+ta.dataset.i;
          var pos=ta.selectionStart;
          var end=ta.selectionEnd;
          var before=ta.value.slice(0,pos);
          var after=ta.value.slice(end);
          if(lines.length===1){
            // Single line — just insert at cursor
            bullets[i]=before+lines[0]+after;
            upd(i);
          } else {
            // Multiple lines — first line merges with text before cursor,
            // last line merges with text after cursor, middle lines are new bullets
            var newBullets=[before+lines[0]];
            for(var li=1;li<lines.length-1;li++) newBullets.push(lines[li]);
            newBullets.push(lines[lines.length-1]+after);
            bullets.splice.apply(bullets,[i,1].concat(newBullets));
            if(bullets.length>7) bullets.length=7;
            upd(i+newBullets.length-1);
          }
          pushUndo();
        });
      });
      bl.querySelectorAll('.bnewline').forEach(function(btn){
        btn.addEventListener('click',function(){
          var i=+btn.dataset.nl;
          var ta=bl.querySelectorAll('.bi')[i];
          var pos=ta.selectionStart;
          pushUndo();
          bullets[i]=ta.value.slice(0,pos)+'\n'+ta.value.slice(pos);
          upd(i);
          setTimeout(function(){var t2=m.querySelector('#blist').querySelectorAll('.bi')[i];if(t2){t2.focus();t2.setSelectionRange(pos+1,pos+1);}},10);
        });
      });
      bl.querySelectorAll('.bdel').forEach(function(btn){btn.addEventListener('click',function(){pushUndo();if(bullets.length>1)bullets.splice(+btn.dataset.d,1);else bullets[0]='';upd();});});
      if(fi>=0){var ts=bl.querySelectorAll('.bi');var tgt=ts[Math.min(fi,ts.length-1)];if(tgt)setTimeout(function(){tgt.focus();tgt.setSelectionRange(0,0);},10);}
    }
    upd();

    m.querySelectorAll('.ltt-btn').forEach(function(btn){btn.addEventListener('click',function(){listType=btn.dataset.lt;m.querySelectorAll('.ltt-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');m.querySelector('#bullets-section').style.display=listType==='quote'?'none':'block';m.querySelector('#quote-section').style.display=listType==='quote'?'block':'none';});});
    m.querySelector('#badd').addEventListener('click',function(){if(bullets.length<7){bullets.push('');upd(bullets.length-1);}});
    m.querySelector('#mcancel').addEventListener('click',function(){S.modal=null;S.insertAfter=null;render();});
    if(editing)m.querySelector('#del-pg-btn').addEventListener('click',function(){S.modal='confirm';S.confirm={type:'del-page',idx:S.editPageIdx,label:'Delete "'+ex.title+'"?',desc:'This page will be permanently removed.'};render();});
    m.querySelector('#msave').addEventListener('click',function(){
      var title=m.querySelector('#ptitle').value.trim();if(!title){m.querySelector('#ptitle').focus();return;}
      var pageData;
      if(listType==='quote'){
        var qt=m.querySelector('#quote-text').value.trim();if(!qt){m.querySelector('#quote-text').focus();return;}
        pageData={title:title,listType:'quote',quoteText:qt,quoteAuthor:m.querySelector('#quote-author').value.trim(),bullets:[]};
      } else {
        var filled=bullets.filter(function(b){return b.trim();});
        pageData={title:title,listType:listType,bullets:filled.length?filled:['Add content here']};
      }
      if(editing){topic.pages[S.editPageIdx]=pageData;}
      else{
        if(S.insertAfter!=null){topic.pages.splice(S.insertAfter+1,0,pageData);S.page=S.insertAfter+1;}
        else{topic.pages.push(pageData);S.page=topic.pages.length-1;}
      }
      S.modal=null;S.editPageIdx=null;S.insertAfter=null;
      saveData();
      if(!editing&&S.view!=='slide')navTo('slide');else render();
    });
    ov.appendChild(m);

  } else if(S.modal==='new-folder'||S.modal==='edit-folder'){
    var editing2=S.modal==='edit-folder';
    var ef=editing2?S.folders.filter(function(f){return f.id===S.editFolderTarget;})[0]:null;
    var m2=el('div','modal');
    m2.innerHTML='<div class="modal-handle"></div><h3>'+(editing2?'Edit Folder':'New Folder')+'</h3><div class="fg"><label>Folder Name</label><input id="fname" value="'+(ef?esc(ef.name):'')+'" placeholder="e.g. Conference Talks" autocomplete="off"></div><div class="macts">'+(editing2?'<button class="btn btn-red" id="del-folder-btn">Delete Folder</button>':'')+'<button class="btn btn-ghost" id="mcancel2">Cancel</button><button class="btn btn-gold" id="msave2">'+(editing2?'Save':'Create')+'</button></div>';
    m2.querySelector('#mcancel2').addEventListener('click',function(){S.modal=null;render();});
    if(editing2)m2.querySelector('#del-folder-btn').addEventListener('click',function(){
      if(!ef)return;
      if(ef.topics.length>0){S.modal='confirm';S.confirm={type:'info',label:'Folder not empty',desc:'"'+ef.name+'" still has '+ef.topics.length+' topic(s). Remove all topics first.'};}
      else{S.modal='confirm';S.confirm={type:'del-folder',id:ef.id,label:'Delete "'+ef.name+'"?',desc:'This empty folder will be permanently deleted.'};}
      render();
    });
    m2.querySelector('#msave2').addEventListener('click',function(){
      var name=m2.querySelector('#fname').value.trim();if(!name){m2.querySelector('#fname').focus();return;}
      if(editing2){ef.name=name;}else{S.folders.push({id:Date.now(),name:name,topics:[]});}
      S.modal=null;saveData();render();
    });
    ov.appendChild(m2);

  } else if(S.modal==='new-topic'||S.modal==='edit-topic'){
    var editing3=S.modal==='edit-topic';
    var et=editing3?allTopics().filter(function(t){return t.id===S.editTopicTarget;})[0]:null;
